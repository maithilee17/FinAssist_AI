  name: finassist-ai

  services:
    postgres:
      image: postgres:17-alpine
      environment:
        POSTGRES_DB: ${POSTGRES_DB:-finassist}
        POSTGRES_USER: ${POSTGRES_USER:-finassist}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finassist_local_only}
      volumes:
        - postgres_data:/var/lib/postgresql/data
      
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finassist} -d ${POSTGRES_DB:-finassist}"]
        interval: 5s
        timeout: 5s
        retries: 10
      restart: unless-stopped

    chroma:
      image: chromadb/chroma:1.5.9
      volumes:
        - chroma_data:/data
      ports:
        - "127.0.0.1:${CHROMA_HOST_PORT:-8001}:8000"
      healthcheck:
        test:
          - CMD
          - bash
          - -ec
          - >-
            exec 3<>/dev/tcp/127.0.0.1/8000;
            printf 'GET /api/v2/heartbeat HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
            IFS= read -r status <&3;
            [[ "$$status" == *" 200 "* ]]
        interval: 5s
        timeout: 5s
        retries: 20
      restart: unless-stopped

    backend:
      build:
        context: ./backend
      env_file:
        - path: .env
          required: false
      environment:
        LLM_PROVIDER: ollama
        OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
        OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
        POSTGRES_HOST: postgres
        POSTGRES_PORT: 5432
        POSTGRES_DB: ${POSTGRES_DB:-finassist}
        POSTGRES_USER: ${POSTGRES_USER:-finassist}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finassist_local_only}
        CHROMA_HOST: chroma
        CHROMA_PORT: 8000
        UPLOAD_DIR: /app/uploads
        HF_HOME: /app/model-cache
        EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
        EMBEDDING_EXPECTED_DIMENSION: ${EMBEDDING_EXPECTED_DIMENSION:-384}
      volumes:
        - upload_data:/app/uploads
        - model_cache:/app/model-cache
      ports:
        - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
      depends_on:
        postgres:
          condition: service_healthy
        chroma:
          condition: service_healthy
      command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
      healthcheck:
        test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/live')"]
        interval: 10s
        timeout: 5s
        retries: 10
      restart: unless-stopped

    frontend:
      build:
        context: ./frontend
        args:
          VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}/api
          VITE_CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-finassist_csrf_token}
          VITE_MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
          VITE_PROCESSING_TIMEOUT_MS: ${VITE_PROCESSING_TIMEOUT_MS:-600000}
      ports:
        - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
      depends_on:
        backend:
          condition: service_healthy
      restart: unless-stopped

  volumes:
    postgres_data:
    chroma_data:
    upload_data:
    model_cache:
